<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELUXE - First Choice Style</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#f5f7f6}
.top{background:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;box-shadow:0 1px 10px #0001}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;color:#0a3d2e}.logo span{color:#00a651}
.hero{position:relative;height:420px;background:url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=1200') center/cover}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0006,#0002)}
.hero-text{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 20px;z-index:2;color:#fff;max-width:1200px;margin:0 auto}
.hero-text h1{font-size:42px;line-height:1.1;max-width:500px;font-weight:800}
.hero-text p{opacity:.9;margin-top:10px}
.search-card{background:#fff;max-width:1100px;margin:-60px auto 0;border-radius:16px;padding:16px;box-shadow:0 12px 30px #0002;position:relative;z-index:10;display:flex;flex-direction:column;gap:12px;margin-left:20px;margin-right:20px}
.search-input{width:100%;padding:16px;border:1px solid #e5e7eb;border-radius:12px;font-size:15px}
.btn-row{display:flex;gap:10px}
.filt{background:#f3f4f6;border:none;padding:12px 18px;border-radius:10px;font-weight:600}
.green{background:#00a651;color:#fff;border:none;padding:12px 28px;border-radius:10px;font-weight:700;cursor:pointer}
.grid{max-width:1200px;margin:30px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px #0001;position:relative;cursor:pointer}
.card img{width:100%;height:230px;object-fit:cover}
.heart{position:absolute;top:12px;right:12px;background:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #0002}
.card-body{padding:14px}
.price{font-weight:800;font-size:18px;color:#0a3d2e}
.title{font-weight:600;margin:4px 0}
.loc{color:#6b7280;font-size:13px}
.wa-float{position:fixed;bottom:20px;right:20px;background:#25D366;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px #0003;z-index:30;font-size:28px;text-decoration:none}
.modal{position:fixed;inset:0;background:#000c;display:none;z-index:50;overflow:auto;padding:16px}
.mc{background:#fff;max-width:900px;margin:20px auto;border-radius:16px;overflow:hidden}
.big{width:100%;height:380px;object-fit:cover}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;background:#000}
.thumbs img{height:110px;object-fit:cover;border-radius:8px;cursor:pointer;width:100%}
.x{position:absolute;top:16px;right:16px;background:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer}
</style></head><body>
<div class=top><div class=logo>🏠 1ST CHOICE <span>VELUXE</span></div><div style="font-size:26px">☰</div></div>

<div class=hero><div class=hero-text><h1>Discover Your Dream Home to rent</h1><p>Browse freely, login when ready to book!</p></div></div>

<div class=search-card>
<input class=search-input placeholder="Search properties, locations..." id="searchBox" onkeyup="filterH()">
<div class=btn-row><button class=filt>Filters</button><button class=green onclick="filterH()">Search</button></div>
</div>

<div class=grid id=grid></div>

<a class=wa-float href="https://wa.me/2340000000000" target="_blank">💬</a>

<div class=modal id=modal><div class=x onclick="closeM()">✕</div><div class=mc id=mc></div></div>

<script>
let H=[
{t:"4 Bedroom Detached Duplex",l:"Lekki, Lagos",pr:"₦4,500,000/yr",d:"4 Bed • 4 Bath • 320 sqm",m:["https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?w=800","https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400","https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=400","https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=400","https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=400","https://images.unsplash.com/photo-1613977257363-707ba9348227?w=400"]},
{t:"Luxury 3Bed Apartment",l:"Ikoyi, Lagos",pr:"₦3,200,000/yr",d:"3 Bed • 3 Bath • 180 sqm",m:["https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=800","https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400","https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?w=400","https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=400","https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=400","https://images.unsplash.com/photo-1613977257363-707ba9348227?w=400"]},
{t:"5 Bedroom Mansion",l:"Banana Island",pr:"₦12,000,000/yr",d:"5 Bed • 6 Bath • 600 sqm",m:["https://images.unsplash.com/photo-1613977257363-707ba9348227?w=800","https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400","https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=400","https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?w=400","https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=400","https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=400"]},
{t:"2 Bedroom Flat",l:"Yaba, Lagos",pr:"₦1,200,000/yr",d:"2 Bed • 2 Bath • 90 sqm",m:["https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=800","https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400","https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=400","https://images.unsplash.com/photo-1613977257363-707ba9348227?w=400","https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?w=400","https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=400"]},
{t:"Palm Jumeirah Villa",l:"Dubai, UAE",pr:"$1,250,000",d:"5 Bed • 6 Bath",m:["https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800","https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=400","https://images.unsplash.com/photo-1613977257363-707ba9348227?w=400","https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?w=400","https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=400","https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=400"]},
{t:"London Penthouse",l:"London, UK",pr:"$3,200/mo",d:"2 Bed • 2 Bath",m:["https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=800","https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=400","https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=400","https://images.unsplash.com/photo-1613977257363-707ba9348227?w=400","https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?w=400","https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=400"]}
];
let saved=JSON.parse(localStorage.getItem('veluxe_global')||'[]');
let A=saved.length?saved.concat(H):H;
function render(list){
document.getElementById('grid').innerHTML=list.map((h,i)=>`<div class=card onclick="openM(${A.indexOf(h)})"><div class=heart>♡</div><img src="${h.m[0]}"><div class=card-body><div class=price>${h.pr}</div><div class=title>${h.t}</div><div class=loc>📍 ${h.l} • ${h.d}</div></div></div>`).join('');
}
function filterH(){
let q=document.getElementById('searchBox').value.toLowerCase();
let f=A.filter(h=> (h.t+h.l).toLowerCase().includes(q));
render(f);
}
function openM(i){
let h=A[i];
document.getElementById('mc').innerHTML=`<img class=big id=big src="${h.m[0]}"><div class=thumbs>${h.m.map(x=>`<img src="${x}" onclick="document.getElementById('big').src='${x}'">`).join('')}</div><div style="padding:16px"><div class=price>${h.pr}</div><h3>${h.t}</h3><p style="color:#6b7280">📍 ${h.l} • ${h.d}</p><p style="margin:10px 0;font-size:13px">✓ Verified ✓ Title Deed ✓ Virtual Tour<br><br>Spacious ${h.t} in ${h.l}. 24/7 light, water, security. Ready to move. Tap WhatsApp to book inspection.</p><a href="https://wa.me/2340000000000?text=Hi, I want ${h.t} in ${h.l}" target="_blank" style="display:block;background:#00a651;color:#fff;text-align:center;padding:14px;border-radius:10px;text-decoration:none;font-weight:700">💬 Chat on WhatsApp</a></div>`;
document.getElementById('modal').style.display='block';
}
function closeM(){document.getElementById('modal').style.display='none'}
render(A);
</script>
</body></html>
