<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VELUXE Global Estates - Worldwide</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Segoe UI,sans-serif}body{background:#f8fafc}.nav{background:white;padding:14px 20px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:99;box-shadow:0 2px 20px rgba(0,0,0,.06)}.logo{font-weight:900;font-size:22px}.logo span{color:#2563eb}.hero{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:white;padding:60px 20px;text-align:center}.hero h1{font-size:38px;font-weight:800}.search{background:white;max-width:900px;margin:20px auto;display:grid;grid-template-columns:1fr 1fr 1fr 90px;gap:10px;padding:12px;border-radius:16px}select,input{padding:12px;border:1px solid #e2e8f0;border-radius:10px}.btn{background:#2563eb;color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer}.grid{max-width:1200px;margin:30px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding:0 20px}.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.05)}.card img{width:100%;height:200px;object-fit:cover}.body{padding:14px}.price{font-size:20px;font-weight:800}.loc{color:#64748b;font-size:13px}.wa{display:block;background:#25D366;color:white;text-align:center;padding:10px;border-radius:10px;text-decoration:none;font-weight:700;margin-top:10px}@media(max-width:700px){.search{grid-template-columns:1fr}.hero h1{font-size:28px}}</style></head><body><div class="nav"><div class="logo">VELUXE <span>GLOBAL</span></div><div>Est. 2026</div></div><div class="hero"><h1>Find Homes Anywhere in the World</h1><p>Verified properties in 50+ countries</p><div class="search"><select><option>All Countries</option><option>Dubai, UAE</option><option>London, UK</option><option>New York, USA</option><option>Lagos, NG</option><option>Toronto, CA</option></select><select><option>Buy / Rent</option><option>Buy</option><option>Rent</option></select><select><option>$100k - $1M+</option></select><button class="btn">Search</button></div></div><div class="grid" id="g"></div><script>const p=[{i:"https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=600",t:"Luxury Villa Palm Jumeirah",l:"Dubai, UAE",pr:"$1,250,000",b:"5 Bed"}, {i:"https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=600",t:"Apartment Canary Wharf",l:"London, UK",pr:"$3,200/mo",b:"2 Bed"}, {i:"https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=600",t:"Penthouse Manhattan",l:"New York, USA",pr:"$2,800,000",b:"3 Bed"}, {i:"https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?w=600",t:"Beachfront Lekki",l:"Lagos, Nigeria",pr:"$450,000",b:"4 Bed"}, {i:"https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=600",t:"Condo Downtown",l:"Toronto, Canada",pr:"$890,000",b:"2 Bed"}, {i:"https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=600",t:"Marina Luxury",l:"Dubai, UAE",pr:"$1,800/mo",b:"1 Bed"}];let h="";p.forEach(x=>{h+=`<div class=card><img src=${x.i}><div class=body><div class=price>${x.pr}</div><div style=font-weight:700>${x.t}</div><div class=loc>${x.l} • ${x.b}</div><a class=wa href="https://wa.me/2340000000000?text=Hi, I want ${x.t} in ${x.l}" target=_blank>WhatsApp Inquiry</a></div></div>`});document.getElementById('g').innerHTML=h;</script></body></html>
