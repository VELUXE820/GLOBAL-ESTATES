<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - VELUXE</title>
<style>
*{font-family:Inter,Arial;box-sizing:border-box}
body{background:#f1f5f9;padding:16px;margin:0}
.box{background:#fff;max-width:720px;margin:0 auto;padding:18px;border-radius:16px;box-shadow:0 6px 20px #0001}
input,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:14px}
button{background:#2563eb;color:#fff;border:none;padding:14px;border-radius:10px;width:100%;font-weight:700;cursor:pointer;margin-top:8px}
.pic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.pic-box{border:2px dashed #cbd5e1;border-radius:12px;padding:10px;text-align:center;background:#f8fafc}
.pic-box img{width:100%;height:90px;object-fit:cover;border-radius:8px;display:none;margin-top:6px}
.house{background:#f8fafc;padding:10px;border-radius:10px;margin:8px 0;display:flex;gap:10px;align-items:center}
.house img{width:60px;height:60px;object-fit:cover;border-radius:8px}
.lab{font-weight:700;font-size:13px;margin-top:10px;display:block}
</style>
</head><body>
<div class="box" id="login">
<h2>🔐 Admin Login</h2>
<input id="pass" type="password" placeholder="Enter password">
<button onclick="if(document.getElementById('pass').value=='admin123'){document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';loadHouses()}else{alert('Wrong! Use admin123')}">Login</button>
</div>
<div class="box" id="main" style="display:none">
<h2>🏠 Add New Property (Pick from Gallery)</h2>
<span class=lab>House Title</span><input id="t" placeholder="e.g Palm Jumeirah Villa">
<span class=lab>Location</span><input id="l" placeholder="e.g Dubai, UAE">
<span class=lab>Price</span><input id="p" placeholder="e.g $1,250,000">
<span class=lab>Bed/Bath</span><input id="b" placeholder="e.g 5 Bed • 6 Bath">
<span class=lab>Write up</span><textarea id="d" placeholder="Describe house..."></textarea>
<span class=lab>📸 6 Pictures - Tap to Pick from Phone</span>
<div class=pic-grid>
<div class=pic-box>Main<input type=file accept="image/*" onchange="read(this,0)"><img id="pv0"></div>
<div class=pic-box>Living<input type=file accept="image/*" onchange="read(this,1)"><img id="pv1"></div>
<div class=pic-box>Kitchen<input type=file accept="image/*" onchange="read(this,2)"><img id="pv2"></div>
<div class=pic-box>Bedroom<input type=file accept="image/*" onchange="read(this,3)"><img id="pv3"></div>
<div class=pic-box>Bathroom<input type=file accept="image/*" onchange="read(this,4)"><img id="pv4"></div>
<div class=pic-box>Pool<input type=file accept="image/*" onchange="read(this,5)"><img id="pv5"></div>
</div>
<button onclick="addHouse()" style="background:#16a34a">+ ADD HOUSE TO WEBSITE</button>
<h3 style="margin-top:22px">Current Houses</h3>
<div id="list"></div>
</div>
<script>
let imgs=[null,null,null,null,null,null];
function read(input,idx){
 let file=input.files[0];if(!file)return;
 let reader=new FileReader();
 reader.onload=function(e){imgs[idx]=e.target.result;let pv=document.getElementById('pv'+idx);pv.src=e.target.result;pv.style.display='block';}
 reader.readAsDataURL(file);
}
let houses=JSON.parse(localStorage.getItem('veluxe_global')||'[]');
function addHouse(){
 let t=document.getElementById('t').value,l=document.getElementById('l').value,pr=document.getElementById('p').value,bed=document.getElementById('b').value;
 let filtered=imgs.filter(x=>x);
 if(!t||filtered.length==0){alert('Add title and at least 1 picture!');return}
 let h={t:t,l:l,pr:pr,d:bed,m:filtered};houses.push(h);
 localStorage.setItem('veluxe_global',JSON.stringify(houses));loadHouses();alert('Added! Go to main site refresh!');
}
function loadHouses(){
 document.getElementById('list').innerHTML=houses.map((h,i)=>`<div class=house><img src="${h.m[0]}"><div><b>${h.t}</b><br>${h.l} - ${h.pr}<br><span style="color:red;font-size:12px;cursor:pointer" onclick="del(${i})">Delete</span></div></div>`).join('')||'<p style="color:gray">No houses yet</p>';
}
function del(i){if(confirm('Delete?')){houses.splice(i,1);localStorage.setItem('veluxe_global',JSON.stringify(houses));loadHouses()}}
</script>
</body></html>
